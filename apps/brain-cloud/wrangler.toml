name = "unai-brain-api"
main = "src/index.ts"
compatibility_date = "2026-10-30"

[[d1_databases]]
binding = "DB"
database_name = "unai-brain"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[assets]
directory = "../brain-web"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
BRAIN_ALLOWED_ORIGIN = "*"
# Set the installation administrator secret before enabling the Worker:
# npx wrangler secret put BRAIN_ADMIN_TOKEN
# Optional default-tenant compatibility credentials:
# npx wrangler secret put BRAIN_READ_TOKEN
# npx wrangler secret put BRAIN_WRITE_TOKEN
# Set a modest per-token and per-source-IP API limit:
BRAIN_RATE_LIMIT_PER_MINUTE = "120"
