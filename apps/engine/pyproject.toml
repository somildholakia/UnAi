[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unai-engine"
version = "0.2.0"
description = "Local-first, evidence-driven coding agent and memory engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0.2,<7.0",
  "cryptography>=42,<47",
]

[project.scripts]
unai-task-mcp = "unai_engine.task_mcp_server:run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
mcp = ["mcp>=2.0.0,<3.0"]
train = [
  "torch>=2.4",
  "transformers>=4.50",
  "datasets>=3.0",
  "peft>=0.14",
  "trl>=1.0,<2.0",
  "accelerate>=1.0",
  "bitsandbytes>=0.45; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
