name: Unpack unAI source bootstrap

on:
  push:
    paths:
      - "tools/bootstrap/payload.b64"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unai-source
          base64 --decode tools/bootstrap/payload.b64 | tar -xz -C /tmp/unai-source
          rsync -a /tmp/unai-source/ ./
          rm -rf tools/bootstrap
          rm -f .github/workflows/unpack-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add unAI Brain, hosted memory API and training harness"
          git push origin HEAD:main
